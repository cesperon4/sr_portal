query GetPost($id: ID!) {
  post(id: $id) {
    id
    title
    body
    userId
    createdAt
    updatedAt
    arrestLogId
    postComments {
      id
      user {
        username
      }
      body
      createdAt
      updatedAt
    }
    arrestLog {
      id
      AGE
      ARREST_STATUS
      ArrestLocationAptFlr
      ArrestLocationCity
      ArrestLocationStreet
      ArrestLocationStreetNBR
      Arrest_Charge
      Arrest_ID
      Case_Number
      Charge_Description
      Charge_Sequence
      DATE_ARRESTED
      DOB
      Degree
      FIRSTNAME
      LASTNAME
      MIDDLENAME
      OBJECTID
      OBJECTID_1
      RACE
      SEX
      SUFFIX
      TIME_ARREST
      UNIQUEKEY
      createdAt
      updatedAt
    }
    user {
      id
      username
    }
    imageUrls
  }
}

query GetPosts($data: PostsInput) {
  posts(data: $data) {
    posts {
      id
      title
      body
      userId
      createdAt
      updatedAt
      arrestLogId
      imageUrls
      user {
        id
        username
      }
      postComments {
        id
        user {
          username
        }
        body
        createdAt
        updatedAt
      }
    }
    cursor
    hasNextPage
  }
}

mutation CreatePost($data: CreatePostInput!) {
  createPost(data: $data) {
    id
  }
}

mutation UpdatePost($id: ID!, $data: UpdatePostInput!) {
  updatePost(id: $id, data: $data) {
    id
  }
}

mutation CreatePostComment($data: CreatePostCommentInput!) {
  createPostComment(data: $data) {
    id
    postId
    body
    createdAt
    updatedAt
  }
}
