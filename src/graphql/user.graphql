# graphql/queries/getUser.graphql
query GetUser($id: ID!) {
  user(id: $id) {
    id
    firstname
    lastname
    email
    username
    password
    role
    createdAt
    updatedAt
  }
}

query GetUsers {
  users {
    data {
      id
      firstname
      lastname
      email
      username
      password
      role
      createdAt
      updatedAt
    }
    status
    message
  }
}

query Me {
  me {
    id
    firstname
    lastname
    email
    username
    role
    createdAt
    updatedAt
  }
}

mutation registerUser($data: CreateUserInput!) {
  registerUser(data: $data)
}

mutation verifyEmail($token: Token!) {
  verifyEmail(token: $token)
}

mutation resendVerificationEmail($email: String!) {
  resendVerificationEmail(email: $email)
}

mutation UpsertUser($data: UpsertUserInput!) {
  upsertUser(data: $data) {
    data {
      user {
        firstname
        lastname
        email
      }
      token
    }
    status
    message
  }
}

mutation UpdateUser($id: ID!, $data: UpdateUserInput!) {
  updateUser(id: $id, data: $data) {
    id
    firstname
    lastname
    email
    username
    password
    createdAt
    updatedAt
  }
}

mutation DeleteUser($id: ID!) {
  deleteUser(id: $id) {
    id
    firstname
    lastname
    email
    username
    role
    createdAt
    updatedAt
  }
}

mutation login($data: LoginInput!) {
  login(data: $data) {
    user {
      id
      firstname
      lastname
      email
      username
      role
      password
      emailVerified
      createdAt
      updatedAt
    }
    token
  }
}

mutation logout {
  logout
}

mutation loginGuest {
  loginGuest {
    token
  }
}
