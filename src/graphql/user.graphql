query GetUserComments($id: ID!, $data: PostCommentInput) {
  user(id: $id) {
    status
    message
    data {
      id
      comments(data: $data) {
        data {
          data {
            id
            body
            createdAt
            updatedAt
            post {
              title
              category
            }
          }
          hasNextPage
          cursor
        }
      }
    }
  }
}

query GetUserLikedPosts($id: ID!, $data: LikedPostInput) {
  user(id: $id) {
    status
    message
    data {
      id
      likedPosts(data: $data) {
        data {
          data {
            id
            post {
              id
              title
              body
              userId
              createdAt
              updatedAt
              arrestLogId
              lat
              lon
              street
              city
              state
              zip
              category
              date_occurred
              postComments {
                id
                user {
                  username
                  role
                }
                body
                createdAt
                updatedAt
              }
              likes {
                id
                postId
                userId
                isActive
                createdAt
                updatedAt
              }
              arrestLog {
                id
                AGE
                ARREST_STATUS
                ArrestLocationAptFlr
                ArrestLocationCity
                ArrestLocationStreet
                ArrestLocationStreetNBR
                Arrest_Charge
                Arrest_ID
                Case_Number
                Charge_Description
                Charge_Sequence
                DATE_ARRESTED
                DOB
                Degree
                FIRSTNAME
                LASTNAME
                MIDDLENAME
                OBJECTID
                OBJECTID_1
                RACE
                SEX
                SUFFIX
                TIME_ARREST
                UNIQUEKEY
                createdAt
                updatedAt
              }
              user {
                id
                username
                role
              }
              imageUrls
            }
          }
          cursor
          hasNextPage
        }
        status
        message
      }
    }
  }
}

